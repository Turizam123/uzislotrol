<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Админ – одобрение</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap" style="grid-template-columns:1fr">
    <section class="card">
      <h1>🛡️ Админ панел – поздрави за одобрение</h1>
      <div class="small">Линкът съдържа ключ. Не го споделяй.</div>

      <hr />
      <div id="status" class="status">Свързване…</div>
      <div id="pending" class="list" style="max-height:70vh"></div>
    </section>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const key = params.get("key") || "";
  const statusEl = document.getElementById("status");
  const pendingEl = document.getElementById("pending");

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function card(item){
    const el = document.createElement("div");
    el.className = "item";
    const t = new Date(item.ts).toLocaleString("bg-BG");
    el.innerHTML = `
      <div class="meta">
        <span class="name">${esc(item.name)}</span>
        <span>${t}</span>
      </div>
      <div class="text">${esc(item.text)}</div>
      <div class="row" style="margin-top:10px">
        <button class="ok" data-approve="${item.id}">Одобри</button>
        <button class="bad" data-reject="${item.id}">Отхвърли</button>
      </div>
    `;
    return el;
  }

  async function loadPending(){
    const r = await fetch(`/api/pending?key=${encodeURIComponent(key)}`);
    if (!r.ok) { statusEl.textContent = "❌ Невалиден ключ"; return; }
    const j = await r.json();
    pendingEl.innerHTML = "";
    j.items.forEach(it => pendingEl.appendChild(card(it)));
    statusEl.textContent = `🟢 Pending: ${j.items.length}`;
  }

  pendingEl.addEventListener("click", async (e) => {
    const idA = e.target?.getAttribute("data-approve");
    const idR = e.target?.getAttribute("data-reject");
    const id = idA || idR;
    if (!id) return;

    const endpoint = idA ? "approve" : "reject";
    const r = await fetch(`/api/${endpoint}?key=${encodeURIComponent(key)}`, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ id })
    });

    if (r.ok) {
      // махаме визуално елемента
      e.target.closest(".item")?.remove();
      statusEl.textContent = "✅ Обновено";
    } else {
      statusEl.textContent = "❌ Грешка";
    }
  });

  // WS само за админ (пращаме key)
  const wsProto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${wsProto}://${location.host}?key=${encodeURIComponent(key)}`);

  ws.addEventListener("open", () => statusEl.textContent = "🟢 Свързан (админ)");
  ws.addEventListener("message", (ev) => {
    const msg = JSON.parse(ev.data);

    if (msg.type === "history_pending") {
      pendingEl.innerHTML = "";
      msg.items.forEach(it => pendingEl.appendChild(card(it)));
      statusEl.textContent = `🟢 Pending: ${msg.items.length}`;
    }
    if (msg.type === "pending_new") {
      pendingEl.prepend(card(msg.item));
      statusEl.textContent = "🟠 Нов поздрав за одобрение";
    }
    if (msg.type === "pending_removed") {
      const node = pendingEl.querySelector(`[data-approve="${msg.id}"]`)?.closest(".item")
        || pendingEl.querySelector(`[data-reject="${msg.id}"]`)?.closest(".item");
      node?.remove();
    }
  });

  loadPending();
</script>
</body>
</html>
