<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS Overlay</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
body{background:transparent;overflow:hidden}
.stack{
  position:fixed;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:16px;
  pointer-events:none;z-index:9999;
}
.stack.bottom{bottom:40px}
.stack.top{top:40px}
.stack.center{top:50%;transform:translate(-50%,-50%)}

.overlayCard{
  min-width:420px;max-width:980px;
  animation: enter .55s cubic-bezier(.2,.8,.2,1);
}
@keyframes enter{
  from{opacity:0;transform:translateY(30px) scale(.96)}
  to{opacity:1;transform:none}
}
.neon{
  box-shadow:
   0 0 18px rgba(120,80,255,.55),
   0 0 42px rgba(0,200,255,.35);
}
.progress{
  height:4px;border-radius:999px;
  background:linear-gradient(90deg,#7c7cff,#00e0ff);
  animation: bar linear forwards;
}
@keyframes bar{from{width:100%}to{width:0%}}
.badge{font-weight:900;opacity:.9}
.big{font-size:clamp(22px,2.6vw,34px);font-weight:900}
.from{opacity:.9;margin-top:6px}
</style>
</head>

<body>
<audio id="notify" src="assets/audio/notify.mp3"></audio>

<div id="stack" class="stack bottom"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/shared.js"></script>
<script>
(() => {
 const stack = document.getElementById('stack');
 const audio = document.getElementById('notify');

 stack.classList.remove('top','bottom','center');
 stack.classList.add(APP_CONFIG.OVERLAY.POSITION);

 function next(){
  return AppStore.getAll()
   .filter(x=>x.approved && !x.shown)
   .sort((a,b)=>a.createdAt-b.createdAt)[0];
 }

 function show(m){
  AppStore.update(m.id,{shown:true});

  const card=document.createElement('div');
  card.className='card overlayCard '+(APP_CONFIG.OVERLAY.NEON?'neon':'');
  card.innerHTML=`
    <div class="badge">🎉 LIVE ПОЗДРАВ</div>
    <div class="big">${escapeHtml(m.text)}</div>
    <div class="from">— ${escapeHtml(m.name)}</div>
    ${APP_CONFIG.OVERLAY.SHOW_PROGRESS?'<div class="progress"></div>':''}
  `;

  const p=card.querySelector('.progress');
  if(p) p.style.animationDuration=APP_CONFIG.OVERLAY.SHOW_MS+'ms';

  stack.appendChild(card);
  audio.currentTime=0;audio.play().catch(()=>{});

  setTimeout(()=>{
    card.style.opacity='0';
    setTimeout(()=>card.remove(),400);
  },APP_CONFIG.OVERLAY.SHOW_MS);

  while(stack.children.length>APP_CONFIG.OVERLAY.STACK_MAX){
    stack.removeChild(stack.firstChild);
  }
 }

 setInterval(()=>{
  const m=next();
  if(m) show(m);
 },APP_CONFIG.OVERLAY.POLL_MS);
})();
</script>
</body>
</html>
