<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моята каса</title>

<style>
:root{
  --main:#8e0e00;
  --bg:#f5f6fa;
  --card:#fff;
  --muted:#666;
  --shadow:0 12px 30px rgba(0,0,0,.12);
}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
}
.wrap{
  max-width:900px;
  margin:20px auto;
  padding:0 14px;
}
h1{
  color:var(--main);
  margin-bottom:10px;
}
.card{
  background:var(--card);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:14px;
}
.title{
  font-weight:900;
  margin-bottom:8px;
}
.kv{
  font-size:14px;
  line-height:1.6;
}
.kv b{color:#000}
.progress{
  height:18px;
  background:#eee;
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}
.progress div{
  height:100%;
  background:linear-gradient(90deg,#8e0e00,#c31432);
}
.muted{color:var(--muted)}
input,button{
  padding:10px;
  font-size:15px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  background:#8e0e00;
  color:#fff;
  font-weight:900;
  border:none;
  cursor:pointer;
}
button:hover{opacity:.9}
</style>
</head>

<body>
<div class="wrap">
<h1>💳 Моята каса</h1>

<div id="content"></div>
</div>

<script>
/******** CONFIG ********/
const SUPABASE_URL = "https://ypmyawbogvwazlhgpftl.supabase.co";
const SUPABASE_ANON = "sb_publishable_HFvM418V1k-PU39ZCv5nEg_9ISQYOjc";

function headers(){
  return {
    apikey: SUPABASE_ANON,
    Authorization: `Bearer ${SUPABASE_ANON}`,
    "Content-Type": "application/json"
  };
}

const content = document.getElementById("content");
let appId = new URLSearchParams(window.location.search).get("app_id");

/* ---------- LOGIN FORM ---------- */
function renderLogin(){
  content.innerHTML = `
    <div class="card">
      <div class="title">🔐 Вход с APP-ID</div>
      <input id="appInput" placeholder="APP-MK1GHCIZ-VN225" style="width:100%;margin-bottom:10px">
      <button id="loginBtn">Влез</button>
      <div class="muted" style="margin-top:8px">
        Въведи APP-ID, който си получил при кандидатстване.
      </div>
    </div>
  `;

  document.getElementById("loginBtn").onclick = () => {
    const val = document.getElementById("appInput").value.trim();
    if (!val){
      alert("Моля, въведи APP-ID");
      return;
    }
    appId = val;
    history.replaceState({}, "", `?app_id=${encodeURIComponent(val)}`);
    loadData();
  };
}

/* ---------- FORMAT ---------- */
function fmt(n){
  const x = Number(n);
  if (!isFinite(x)) return "—";
  return x.toFixed(2) + " €";
}

/* ---------- LOAD DATA ---------- */
async function loadData(){
  content.innerHTML = `<div class="muted">Зареждане…</div>`;

  /* 1️⃣ Application */
  const appRes = await fetch(
    `${SUPABASE_URL}/rest/v1/applications?app_id=eq.${encodeURIComponent(appId)}&limit=1`,
    { headers: headers() }
  );
  const appData = await appRes.json();
  if (!appData[0]){
    content.innerHTML = "❌ Невалиден APP-ID.";
    return;
  }
  const app = appData[0];

  /* 2️⃣ Loan */
  const loanRes = await fetch(
    `${SUPABASE_URL}/rest/v1/approved_loans?app_id=eq.${encodeURIComponent(appId)}&limit=1`,
    { headers: headers() }
  );
  const loanData = await loanRes.json();
  const loan = loanData[0];

  /* 3️⃣ Payments */
  let paid = 0;
  if (loan){
    const payRes = await fetch(
      `${SUPABASE_URL}/rest/v1/loan_payments?app_id=eq.${encodeURIComponent(appId)}`,
      { headers: headers() }
    );
    const pays = await payRes.json().catch(()=>[]);
    paid = pays.reduce((s,p)=>s + Number(p.amount||0),0);
  }

  const percent = loan ? Math.min((paid / loan.total_amount) * 100, 100) : 0;

  content.innerHTML = `
    <div class="card">
      <div class="title">📄 Данни по заявката</div>
      <div class="kv">
        <b>APP-ID:</b> ${app.app_id}<br>
        <b>Име:</b> ${app.applicant_name}<br>
        <b>Телефон:</b> ${app.phone}<br>
        <b>Цел:</b> ${app.purpose || "—"}<br>
        <b>Заетост:</b> ${app.employment || "—"}<br>
        <b>Доход:</b> ${fmt(app.net_income)}<br>
        <b>Разходи:</b> ${fmt(app.monthly_expenses)}
      </div>
    </div>

    <div class="card">
      <div class="title">💳 Данни по кредита</div>
      ${loan ? `
        <div class="kv">
          <b>Сума:</b> ${fmt(loan.loan_amount)}<br>
          <b>Лихва:</b> ${loan.interest_rate}%<br>
          <b>Срок:</b> ${loan.months} месеца<br>
          <b>Вноска:</b> ${fmt(loan.monthly_payment)}<br>
          <b>Общо:</b> ${fmt(loan.total_amount)}<br>
          <b>Върнато:</b> ${fmt(paid)}<br>
          <b>Остатък:</b> ${fmt(loan.total_amount - paid)}<br>
          <b>Статус:</b> ${loan.status}
        </div>

        <div class="progress">
          <div style="width:${percent}%"></div>
        </div>
        <div class="muted">Изплатено: ${percent.toFixed(1)}%</div>
      ` : `<span class="muted">Кредитът още не е активиран.</span>`}
    </div>
  `;
}

/* ---------- INIT ---------- */
if (!appId){
  renderLogin();
} else {
  loadData();
}
</script>
</body>
</html>
