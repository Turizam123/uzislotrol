<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моята каса</title>

<style>
:root{
  --main:#8e0e00;
  --bg:#f5f6fa;
  --card:#fff;
  --muted:#666;
  --shadow:0 12px 30px rgba(0,0,0,.12);
}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
}
.wrap{
  max-width:900px;
  margin:20px auto;
  padding:0 14px;
}
h1{
  color:var(--main);
  margin-bottom:10px;
}
.card{
  background:var(--card);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:14px;
}
.title{
  font-weight:900;
  margin-bottom:8px;
}
.kv{
  font-size:14px;
  line-height:1.6;
}
.kv b{color:#000}
.progress{
  height:18px;
  background:#eee;
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}
.progress div{
  height:100%;
  background:linear-gradient(90deg,#8e0e00,#c31432);
}
.muted{color:var(--muted)}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #eee;
  text-align:left;
}
th{font-weight:900}
</style>
</head>

<body>
<div class="wrap">
<h1>💳 Моята каса</h1>

<div id="content" class="muted">Зареждане…</div>
</div>

<script>
/******** CONFIG ********/
const SUPABASE_URL = "https://ypmyawbogvwazlhgpftl.supabase.co";
const SUPABASE_ANON = "sb_publishable_HFvM418V1k-PU39ZCv5nEg_9ISQYOjc";

function headers(){
  return {
    apikey: SUPABASE_ANON,
    Authorization: `Bearer ${SUPABASE_ANON}`,
    "Content-Type": "application/json"
  };
}

const appId = new URLSearchParams(window.location.search).get("app_id");
const content = document.getElementById("content");

if (!appId){
  content.innerHTML = "❌ Липсва APP-ID.";
  throw new Error("Missing app_id");
}

function fmt(n){
  const x = Number(n);
  if (!isFinite(x)) return "—";
  return x.toFixed(2) + " €";
}

async function loadData(){
  /* 1️⃣ Заявка */
  const appRes = await fetch(
    `${SUPABASE_URL}/rest/v1/applications?app_id=eq.${encodeURIComponent(appId)}&limit=1`,
    { headers: headers() }
  );
  const appData = await appRes.json();
  if (!appData[0]){
    content.innerHTML = "❌ Няма намерена заявка.";
    return;
  }
  const app = appData[0];

  /* 2️⃣ Одобрен кредит */
  const loanRes = await fetch(
    `${SUPABASE_URL}/rest/v1/approved_loans?app_id=eq.${encodeURIComponent(appId)}&status=eq.active&limit=1`,
    { headers: headers() }
  );
  const loanData = await loanRes.json();
  const loan = loanData[0];

  let paid = 0;
  let percent = 0;
  if (loan){
    percent = Math.min((paid / loan.total_amount) * 100, 100);
  }

  content.innerHTML = `
    <div class="card">
      <div class="title">📄 Данни по заявката</div>
      <div class="kv">
        <b>APP-ID:</b> ${app.app_id}<br>
        <b>Име:</b> ${app.applicant_name}<br>
        <b>Телефон:</b> ${app.phone}<br>
        <b>Цел:</b> ${app.purpose || "—"}<br>
        <b>Заетост:</b> ${app.employment || "—"}<br>
        <b>Доход:</b> ${fmt(app.net_income)}<br>
        <b>Разходи:</b> ${fmt(app.monthly_expenses)}
      </div>
    </div>

    <div class="card">
      <div class="title">💳 Данни по кредита</div>
      ${loan ? `
      <div class="kv">
        <b>Сума:</b> ${fmt(loan.loan_amount)}<br>
        <b>Лихва:</b> ${loan.interest_rate}%<br>
        <b>Срок:</b> ${loan.months} месеца<br>
        <b>Вноска:</b> ${fmt(loan.monthly_payment)}<br>
        <b>Общо за връщане:</b> ${fmt(loan.total_amount)}<br>
        <b>Статус:</b> ${loan.status}
      </div>

      <div class="progress">
        <div style="width:${percent}%"></div>
      </div>
      <div class="muted">Изплатено: ${percent.toFixed(1)}%</div>
      ` : `<span class="muted">Кредитът още не е активиран.</span>`}
    </div>
  `;
}

loadData();
</script>
</body>
</html>
