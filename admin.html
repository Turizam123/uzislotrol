<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Админ панел</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg">
  <div class="noise"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">★</div>
      <div class="brandText">
        <div class="brandTitle">Админ панел</div>
        <div class="brandSub">Одобрение + настройки</div>
      </div>
    </div>
    <nav class="topActions">
      <a class="btn ghost" href="index.html">Начало</a>
      <a class="btn ghost" href="send.html">Форма</a>
      <a class="btn" href="overlay.html" target="_blank" rel="noopener">OBS Overlay</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div class="row spread">
        <div>
          <h2>🔐 Вход (PIN)</h2>
          <p class="muted">PIN е локален (в браузъра). Смени го в <code>assets/js/config.js</code>.</p>
        </div>
        <div class="pinBox">
          <input id="pin" inputmode="numeric" placeholder="Въведи PIN" />
          <button class="btn" id="loginBtn">Влез</button>
        </div>
      </div>

      <div id="adminArea" class="adminArea hidden">
        <div class="grid2">
          <div class="card inner">
            <h3>🔁 TikTok LIVE линк</h3>
            <div class="field">
              <input id="tiktokLink" placeholder="Постави TikTok LIVE линк тук…" />
            </div>
            <div class="row">
              <button class="btn" id="saveTiktok">Запази</button>
              <button class="btn ghost" id="copyOverlay">Копирай overlay URL</button>
            </div>
            <div class="hint">Линкът се вижда и на index/send.</div>
          </div>

          <div class="card inner">
            <h3>⚙️ Инструменти</h3>
            <div class="row">
              <button class="btn ghost" id="resetShown">Маркирай всички като НЕпоказани</button>
              <button class="btn danger ghost" id="clearAll">Изтрий всички поздрави</button>
            </div>
            <div class="hint">Полезно преди нов лайв.</div>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="pending">Чакащи</button>
          <button class="tab" data-tab="approved">Одобрени</button>
          <button class="tab" data-tab="shown">Показани</button>
        </div>

        <div id="list" class="list big"></div>
      </div>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/shared.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
