<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Заявки за кредит</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
  :root{
    --bg1:#8e0e00;
    --bg2:#c31432;
    --accent:#c31432;
    --card:#fff;
    --muted:#666;
    --shadow: 0 15px 40px rgba(0,0,0,.18);
    --ok:#0f7a3a;
    --warn:#a85b00;
    --bad:#a10f28;
    --chip:#f6f6f6;
  }
  body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,var(--bg1),var(--bg2));
  }
  .wrap{
    max-width: 1200px;
    margin: 22px auto;
    padding: 0 14px;
  }
  .card{
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px;
  }
  h1{
    margin:0 0 10px;
    color: #fff;
    font-size: 22px;
  }
  .topbar{
    display:flex;
    gap:10px;
    flex-wrap: wrap;
    align-items:center;
    margin: 10px 0 14px;
  }
  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin: 0 0 14px;
  }
  .stat{
    background: rgba(255,255,255,.14);
    color:#fff;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    padding: 10px 12px;
    display:flex;
    gap:8px;
    align-items:baseline;
  }
  .stat b{ font-size:16px; }
  .stat span{ font-size:12px; opacity:.9; }

  input, select, textarea, button{
    font-size: 14px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    box-sizing: border-box;
  }
  button{
    border:none;
    cursor:pointer;
    font-weight: 900;
  }
  .btn{
    background: var(--accent);
    color:#fff;
  }
  .btn:hover{ opacity: .92; }
  .btn.secondary{
    background: #f1f1f1;
    color:#111;
    border: 1px solid #ddd;
  }
  .btn.ok{ background: var(--ok); }
  .btn.bad{ background: var(--bad); }

  .grid{
    display:grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 980px){
    .grid{ grid-template-columns: 1fr; }
  }
  table{
    width:100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td{
    padding: 10px;
    border-bottom: 1px solid #eee;
    text-align:left;
    vertical-align: top;
  }
  th{ color:#111; font-weight: 900; }
  tr:hover{ background:#fafafa; }

  .muted{ color: var(--muted); }

  .pill{
    display:inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 900;
    background:#f6f6f6;
  }
  .pill.ok{ background:#e9f7ef; color: var(--ok); }
  .pill.warn{ background:#fff4e6; color: var(--warn); }
  .pill.bad{ background:#fdecec; color: var(--bad); }

  .boxTitle{
    font-weight: 900;
    margin: 0 0 8px;
    color:#111;
  }
  .kv{
    font-size: 13px;
    line-height: 1.55;
  }
  .kv b{ color:#111; }

  textarea{
    width:100%;
    min-height: 110px;
    resize: vertical;
  }
  .note{
    font-size: 12px;
    color:#333;
    line-height: 1.35;
  }
  .statusRow{
    display:flex;
    gap:10px;
    flex-wrap: wrap;
    align-items:center;
    margin-top: 10px;
  }
  .danger{
    background: var(--bad);
    color:#fff;
  }

  .riskChip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:999px;
    font-weight:900;
    font-size:12px;
    background: var(--chip);
    margin-left:8px;
  }
  .riskChip.low{ background:#e9f7ef; color:var(--ok); }
  .riskChip.mid{ background:#fff4e6; color:var(--warn); }
  .riskChip.high{ background:#fdecec; color:var(--bad); }
</style>
</head>
<body>

<div class="wrap">
  <h1>🧾 Admin – Заявки за кредит</h1>

  <div class="stats" id="stats">
    <div class="stat"><b id="stTotal">—</b><span>Общо заявки</span></div>
    <div class="stat"><b id="stActive">—</b><span>Active</span></div>
    <div class="stat"><b id="stRejected">—</b><span>Rejected</span></div>
    <div class="stat"><b id="stRisky">—</b><span>Рискови</span></div>
  </div>

  <div class="topbar">
    <input id="q" type="text" placeholder="Търси по име/телефон/APP-ID…" style="flex:1; min-width:220px;">
    <select id="statusFilter">
      <option value="">Всички статуси</option>
      <option value="received">received</option>
      <option value="precheck">precheck</option>
      <option value="kyc">kyc</option>
      <option value="underwriting">underwriting</option>
      <option value="offer_sent">offer_sent</option>
      <option value="signed">signed</option>
      <option value="paid_out">paid_out</option>
      <option value="active">active</option>
      <option value="closed">closed</option>
      <option value="overdue">overdue</option>
      <option value="rejected">rejected</option>
    </select>
    <button class="btn" id="refresh">⟳ Обнови</button>
    <button class="btn secondary" id="clearSel">Изчисти избор</button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="boxTitle">Списък заявки</div>
      <table>
        <thead>
          <tr>
            <th>Дата</th>
            <th>APP-ID</th>
            <th>Клиент</th>
            <th>Оферта</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="muted">Няма данни (или Supabase не е настроен).</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card" id="detailsCard">
      <div class="boxTitle">Детайли</div>
      <div class="muted">Избери заявка отляво.</div>
    </div>
  </div>
</div>

<script>
  /***************
   * CONFIG
   ***************/
  const SUPABASE_URL = "https://ypmyawbogvwazlhgpftl.supabase.co";
  const SUPABASE_ANON = "sb_publishable_HFvM418V1k-PU39ZCv5nEg_9ISQYOjc";

  function headers(){
    return {
      "apikey": SUPABASE_ANON,
      "Authorization": `Bearer ${SUPABASE_ANON}`,
      "Content-Type": "application/json"
    };
  }

  const tbody = document.getElementById('tbody');
  const qEl = document.getElementById('q');
  const statusEl = document.getElementById('statusFilter');
  const detailsCard = document.getElementById('detailsCard');

  const stTotal = document.getElementById('stTotal');
  const stActive = document.getElementById('stActive');
  const stRejected = document.getElementById('stRejected');
  const stRisky = document.getElementById('stRisky');

  let selected = null;
  let rows = [];

  function pillForStatus(s){
    const v = (s||"").toLowerCase();
    if (["paid_out","active","closed","signed"].includes(v)) return `pill ok`;
    if (["received","precheck","kyc","underwriting","offer_sent"].includes(v)) return `pill warn`;
    if (["overdue","rejected"].includes(v)) return `pill bad`;
    return `pill`;
  }

  function fmt(n){
    const x = Number(n);
    if (!isFinite(x)) return "—";
    return x.toFixed(2) + " €";
  }

  // прост риск-скоринг (работи с твоите полета)
  function riskFor(r){
    const income = Number(r.net_income ?? r.income ?? 0);
    const exp = Number(r.monthly_expenses ?? r.expenses ?? 0);
    const weekly = Number(r.weekly_payment ?? 0);
    const monthlyPayApprox = weekly ? weekly * 4 : Number(r.monthly_payment ?? 0);
    const amount = Number(r.amount ?? 0);

    let points = 0;

    if (income > 0 && exp > 0 && exp >= income) points += 3;
    if (income > 0 && monthlyPayApprox > 0 && (monthlyPayApprox / income) > 0.35) points += 2;
    if (amount > 3000) points += 1;
    if ((r.employment||"").toLowerCase().includes("безработ")) points += 2;
    if ((r.status||"").toLowerCase() === "overdue") points += 3;

    if (points >= 4) return { level:"high", label:"ВИСОК РИСК" };
    if (points >= 2) return { level:"mid", label:"СРЕДЕН РИСК" };
    return { level:"low", label:"НИСЪК РИСК" };
  }

  function renderStats(){
    const total = rows.length;
    const active = rows.filter(r => String(r.status).toLowerCase() === "active").length;
    const rejected = rows.filter(r => String(r.status).toLowerCase() === "rejected").length;
    const risky = rows.filter(r => riskFor(r).level === "high").length;

    stTotal.textContent = total;
    stActive.textContent = active;
    stRejected.textContent = rejected;
    stRisky.textContent = risky;
  }

  async function fetchApplications(){
    if (!SUPABASE_URL || !SUPABASE_ANON){
      tbody.innerHTML = `<tr><td colspan="5" class="muted">Попълни SUPABASE_URL и SUPABASE_ANON в admin.html</td></tr>`;
      return;
    }

    const url = `${SUPABASE_URL}/rest/v1/applications?select=*` +
      `&order=created_at.desc&limit=200`;

    const res = await fetch(url, { headers: headers() });
    if (!res.ok){
      const t = await res.text().catch(()=> "");
      tbody.innerHTML = `<tr><td colspan="5" class="muted">Грешка при зареждане: ${t || res.statusText}</td></tr>`;
      return;
    }

    rows = await res.json();
    renderStats();
    renderTable();
  }

  function matchesFilter(r){
    const q = (qEl.value||"").trim().toLowerCase();
    const sf = (statusEl.value||"").trim().toLowerCase();

    if (sf && (r.status||"").toLowerCase() !== sf) return false;
    if (!q) return true;

    const hay = [
      r.app_id, r.applicant_name, r.phone,
      r.client_email, r.email,
      (r.purpose||""), (r.employment||"")
    ].join(" ").toLowerCase();

    return hay.includes(q);
  }

  function renderTable(){
    const filtered = rows.filter(matchesFilter);
    if (!filtered.length){
      tbody.innerHTML = `<tr><td colspan="5" class="muted">Няма резултати.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(r=>{
      const dt = r.created_at ? new Date(r.created_at).toLocaleString('bg-BG') : "—";
      const statusClass = pillForStatus(r.status);
      const risk = riskFor(r);
      return `
        <tr data-id="${r.id}">
          <td>${dt}</td>
          <td><b>${r.app_id || "—"}</b></td>
          <td>${(r.applicant_name||"—")}<br><span class="muted">${(r.phone||"—")}</span></td>
          <td>
            <span class="muted">Сума:</span> ${fmt(r.amount)}<br>
            <span class="muted">Вноска:</span> ${fmt(r.weekly_payment)}<br>
            <span class="muted">Общо:</span> ${fmt(r.total_payable)}
          </td>
          <td>
            <span class="${statusClass}">${r.status || "—"}</span>
            <span class="riskChip ${risk.level}">${risk.label}</span>
          </td>
        </tr>`;
    }).join("");

    [...tbody.querySelectorAll('tr[data-id]')].forEach(tr=>{
      tr.addEventListener('click', ()=>{
        const id = tr.getAttribute('data-id');
        selected = rows.find(x=>String(x.id)===String(id));
        renderDetails();
      });
    });
  }

  function safeClientEmail(r){
    return (r.client_email || r.email || "").trim();
  }

  async function ensureApprovedLoanForApplication(r){
    const appId = (r.app_id || "").trim();
    const clientEmail = safeClientEmail(r);

    if (!appId){
      alert("Липсва APP-ID в заявката. Няма как да направя кредит.");
      return;
    }
    if (!clientEmail){
      alert("Липсва client_email/email в заявката. Добави поле client_email в applications.");
      return;
    }

    // 1) проверка да няма вече запис
    const checkUrl = `${SUPABASE_URL}/rest/v1/approved_loans?select=id&app_id=eq.${encodeURIComponent(appId)}&limit=1`;
    const checkRes = await fetch(checkUrl, { headers: headers() });

    if (checkRes.ok){
      const ex = await checkRes.json().catch(()=>[]);
      if (ex && ex.length){
        // вече има
        return;
      }
    }

    // 2) insert
    const insUrl = `${SUPABASE_URL}/rest/v1/approved_loans`;
    const payload = {
      app_id: appId,
      client_email: clientEmail,
      loan_amount: r.amount ?? null,
      interest_rate: r.apr ?? 0,
      months: r.months ?? null,
      monthly_payment: r.weekly_payment ?? null,
      total_amount: r.total_payable ?? null,
      status: "active"
    };

    const insRes = await fetch(insUrl, {
      method: "POST",
      headers: { ...headers(), "Prefer":"return=minimal" },
      body: JSON.stringify(payload)
    });

    if (!insRes.ok){
      const t = await insRes.text().catch(()=> "");
      alert("❌ Не успях да създам approved_loans запис:\n" + (t || insRes.statusText));
      return;
    }
  }

  function renderDetails(){
    if (!selected){
      detailsCard.innerHTML = `<div class="boxTitle">Детайли</div><div class="muted">Избери заявка отляво.</div>`;
      return;
    }

    const r = selected;
    const dt = r.created_at ? new Date(r.created_at).toLocaleString('bg-BG') : "—";
    const statusClass = pillForStatus(r.status);
    const risk = riskFor(r);

    detailsCard.innerHTML = `
      <div class="boxTitle">Детайли – ${r.app_id || "—"}</div>

      <div class="kv">
        <b>Дата:</b> ${dt}<br>
        <b>Клиент:</b> ${r.applicant_name || "—"}<br>
        <b>Телефон:</b> ${r.phone || "—"}<br>
        <b>Email:</b> ${safeClientEmail(r) || "—"}<br>
        <b>Начална дата:</b> ${r.start_date || "—"}<br><br>

        <b>Оферта:</b><br>
        • Сума: <b>${fmt(r.amount)}</b><br>
        • Гаранция: <b>${fmt(r.guarantee)}</b> • База: <b>${fmt(r.base)}</b><br>
        • Период: <b>${r.months || "—"}</b> м / <b>${r.weeks || "—"}</b> седм<br>
        • APR: <b>${(r.apr ?? "—")}%</b> • ГПР (инд.): <b>${(r.gpr_est ?? "—")}%</b><br>
        • Седм. вноска: <b>${fmt(r.weekly_payment)}</b><br>
        • Общо: <b>${fmt(r.total_payable)}</b><br><br>

        <b>Профил:</b><br>
        • Доход: <b>${fmt(r.net_income)}</b> / Разходи: <b>${fmt(r.monthly_expenses)}</b><br>
        • Заетост: <b>${r.employment || "—"}</b><br>
        • Цел: <b>${r.purpose || "—"}</b><br><br>

        <b>Статус:</b> <span class="${statusClass}">${r.status || "—"}</span>
        <span class="riskChip ${risk.level}">${risk.label}</span>
      </div>

      <div class="statusRow">
        <select id="newStatus">
          ${["received","precheck","kyc","underwriting","offer_sent","signed","paid_out","active","closed","overdue","rejected"]
            .map(s=>`<option value="${s}" ${String(r.status)===s?"selected":""}>${s}</option>`).join("")}
        </select>
        <button class="btn" id="saveStatus">💾 Запази статус</button>
        <button class="btn ok" id="approveBtn">✅ Одобри (active)</button>
        <button class="btn bad" id="rejectBtn">⛔ Откажи (rejected)</button>
        <button class="btn secondary" id="copyId">📋 Копирай APP-ID</button>
      </div>

      <div style="margin-top:12px;">
        <div class="boxTitle">Админ бележки</div>
        <textarea id="notes" placeholder="Бележки, резултат от разговор, документи…">${r.admin_notes || ""}</textarea>
        <div class="statusRow">
          <button class="btn" id="saveNotes">💾 Запази бележки</button>
          <button class="danger" id="markRejected">⛔ Маркирай rejected</button>
        </div>
        <div class="note">Важно: ако Update policy за applications не е разрешена – статусът няма да се записва.</div>
      </div>
    `;

    document.getElementById('copyId').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(r.app_id || "");
        alert("Копирано.");
      }catch(e){
        alert("Не успях да копирам. (Браузър ограничение)");
      }
    });

    document.getElementById('saveStatus').addEventListener('click', async ()=>{
      const ns = document.getElementById('newStatus').value;
      await updateApplication(r.id, { status: ns });
    });

    document.getElementById('approveBtn').addEventListener('click', async ()=>{
      await updateApplication(r.id, { status: "active" });
    });

    document.getElementById('rejectBtn').addEventListener('click', async ()=>{
      const notes = document.getElementById('notes').value;
      await updateApplication(r.id, { status: "rejected", admin_notes: notes });
    });

    document.getElementById('saveNotes').addEventListener('click', async ()=>{
      const notes = document.getElementById('notes').value;
      await updateApplication(r.id, { admin_notes: notes });
    });

    document.getElementById('markRejected').addEventListener('click', async ()=>{
      if (!confirm("Сигурен ли си, че искаш да маркираш rejected?")) return;
      const notes = document.getElementById('notes').value;
      await updateApplication(r.id, { status: "rejected", admin_notes: notes });
    });
  }

  async function updateApplication(id, patch){
    if (!SUPABASE_URL || !SUPABASE_ANON){
      alert("Попълни SUPABASE_URL и SUPABASE_ANON.");
      return;
    }

    const url = `${SUPABASE_URL}/rest/v1/applications?id=eq.${encodeURIComponent(id)}`;

    const res = await fetch(url, {
      method: "PATCH",
      headers: { ...headers(), "Prefer":"return=representation" },
      body: JSON.stringify(patch)
    });

    if (!res.ok){
      const t = await res.text().catch(()=> "");
      alert("Грешка при запис: " + (t || res.statusText));
      return;
    }

    // Ако PostgREST върне 204/празно, това НЕ значи че не е записано.
    // Просто ще презаредим списъка.
    const updated = await res.json().catch(()=> []);

    if (updated && updated[0]){
      selected = updated[0];

      // ако статусът е станал active → правим запис в approved_loans
      if ((patch.status || "").toLowerCase() === "active") {
        await ensureApprovedLoanForApplication(selected);
      }

      rows = rows.map(x=> String(x.id)===String(selected.id) ? selected : x);
      renderStats();
      renderTable();
      renderDetails();
      alert("Запазено.");
    } else {
      // няма върнати данни, но update може да е успешен → re-fetch
      await fetchApplications();

      // ако трябва да направим кредит при active:
      if ((patch.status || "").toLowerCase() === "active") {
        // след fetchApplications намираме реда пак
        const again = rows.find(x => String(x.id) === String(id));
        if (again) {
          selected = again;
          await ensureApprovedLoanForApplication(again);
        }
      }

      selected = rows.find(x => String(x.id) === String(id)) || null;
      renderDetails();
      alert("Запазено (без връщане на данни) – списъкът е обновен.");
    }
  }

  // Events
  document.getElementById('refresh').addEventListener('click', fetchApplications);
  document.getElementById('clearSel').addEventListener('click', ()=>{
    selected = null;
    renderDetails();
  });
  qEl.addEventListener('input', renderTable);
  statusEl.addEventListener('change', renderTable);

  // Init
  fetchApplications();
</script>

</body>
</html>
