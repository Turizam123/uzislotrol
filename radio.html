<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Моето Онлайн Радио</title>

<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0b0b0b; color:#fff; font-family:Arial, Helvetica, sans-serif; padding:18px;
  }
  .player{
    width:min(420px, 100%);
    background:#111; border:1px solid rgba(255,255,255,.12);
    padding:18px; border-radius:18px; box-shadow:0 0 28px rgba(0,255,0,.35);
    text-align:center;
  }
  h1{margin:0 0 8px; font-size:18px}
  .status{font-size:13px; color:#00ff6a; margin-bottom:12px}
  audio{width:100%}
  .btns{display:flex; gap:10px; margin-top:12px}
  button{
    flex:1; padding:10px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06); color:#fff; font-weight:700; cursor:pointer;
  }
  button:hover{background:rgba(255,255,255,.10)}
  .err{
    display:none; margin-top:12px; padding:10px 12px; border-radius:14px;
    border:1px solid rgba(255,80,80,.35); background:rgba(255,80,80,.10);
    color:rgba(255,230,230,.95); font-size:12px; text-align:left; line-height:1.45;
  }
  .note{margin-top:10px; font-size:12px; color:#aaa}
  a{color:#aef; text-decoration:none; border-bottom:1px dotted rgba(170,238,255,.6)}
  .small{margin-top:8px; font-size:11px; color:rgba(255,255,255,.55)}
</style>
</head>

<body>
  <div class="player">
    <h1>📻 Моето Онлайн Радио</h1>
    <div class="status" id="st">Готово за слушане</div>

    <audio id="radio" controls preload="none"></audio>

    <div class="btns">
      <button id="play">▶️ Пусни</button>
      <button id="stop">⏹️ Спри</button>
    </div>

    <div class="err" id="err"></div>

    <div class="note">
      Ако не тръгва вграденият плеър, използвай: <a id="openLink" href="#" target="_blank" rel="noopener">Отвори стрийма</a>
    </div>
    <div class="small">Излъчване чрез Winamp</div>
  </div>

<script>
  // 🔁 Fallback линкове (точно както ги дава панела ти)
  const STREAMS = [
    "https://httpsuizitimeweeb.radiostream321.com",
    "https://httpsuizitimeweeb.radio12345.com",
    "https://httpsuizitimeweeb.radiostream123.com"
  ];

  const audio = document.getElementById('radio');
  const st = document.getElementById('st');
  const err = document.getElementById('err');
  const openLink = document.getElementById('openLink');

  let currentIndex = 0;

  function setSource(i){
    currentIndex = i;
    audio.innerHTML = "";
    const s = document.createElement("source");
    s.src = STREAMS[i];
    s.type = "audio/mpeg";
    audio.appendChild(s);
    openLink.href = STREAMS[i];
    err.style.display = "none";
    err.textContent = "";
    st.textContent = "Източник: " + STREAMS[i];
    audio.load();
  }

  function showError(msg){
    err.style.display = "block";
    err.textContent = msg;
  }

  // пробваме първия
  setSource(0);

  document.getElementById('play').addEventListener('click', async () => {
    err.style.display = "none";
    try{
      await audio.play();
    }catch(e){
      showError("Браузърът блокира пускането. Натисни Play от самия плеър или разреши autoplay за сайта.");
    }
  });

  document.getElementById('stop').addEventListener('click', () => {
    audio.pause();
    try{ audio.currentTime = 0; }catch(e){}
    st.textContent = "Спряно";
  });

  // ако даден стрийм даде error -> минаваме на следващия
  audio.addEventListener('error', () => {
    const next = currentIndex + 1;
    if(next < STREAMS.length){
      setSource(next);
      showError("Този линк се блокира/не работи в сайта. Пробвам следващия…");
      // опитай автоматично да пуснеш (може да е блокирано)
      audio.play().catch(()=>{});
    } else {
      showError(
        "Нито един от 3-те линка не тръгва в твоя сайт. " +
        "Причината е почти сигурно HTTPS/CSP/CORS ограничение от хостинга. " +
        "Ползвай „Отвори стрийма“ или кажи къде е хостнат сайтът ти, за да дам точния fix."
      );
      st.textContent = "Проблем с вграждането";
    }
  });

  audio.addEventListener('playing', () => {
    st.textContent = "ON AIR ✅";
  });

  audio.addEventListener('waiting', () => {
    st.textContent = "BUFFERING…";
  });
</script>
</body>
</html>
