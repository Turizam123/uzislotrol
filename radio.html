<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Моето Онлайн Радио</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.player {
    background: #111;
    border-radius: 15px;
    padding: 20px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,255,0,0.4);
}

.player h1 {
    font-size: 20px;
    margin-bottom: 10px;
}

.status {
    color: #00ff00;
    font-size: 14px;
    margin-bottom: 15px;
}

audio {
    width: 100%;
}
</style>
</head>

<body>

<div class="player">
    <h1>📻 LIVE RADIO</h1>
    <div class="status">ON AIR</div>

    <audio controls>
        <source src="http://uk25freenew.listen2myradio.com:4871/stream" type="audio/mpeg">
        Браузърът не поддържа аудио.
    </audio>

    <p style="font-size:12px;color:#aaa;margin-top:10px;">
        Излъчване чрез Winamp
    </p>
</div>

</body>
</html>
