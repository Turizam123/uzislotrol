<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Моето Онлайн Радио</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0b0b;
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
}
.player{
  background:#111;
  padding:22px;
  border-radius:18px;
  width:320px;
  text-align:center;
  box-shadow:0 0 28px rgba(0,255,0,.45);
}
.player h1{
  font-size:18px;
  margin:0 0 8px;
}
.status{
  font-size:13px;
  color:#00ff6a;
  margin-bottom:14px;
}
audio{
  width:100%;
}
.note{
  margin-top:10px;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="player">
  <h1>📻 Моето Онлайн Радио</h1>
  <div class="status">LIVE</div>

  <audio controls>
    <source src="https://httpsuizitimeweeb.radiostream321.com" type="audio/mpeg">
    Браузърът не поддържа аудио.
  </audio>

  <div class="note">
    Излъчване чрез Winamp
  </div>
</div>

</body>
</html>
