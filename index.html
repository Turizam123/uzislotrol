<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <title>Поздрави на живо</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f17;
      color: #ffffff;
    }

    .wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      min-height: 100vh;
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    .left, .right {
      background: #121a27;
      padding: 16px;
      border-radius: 16px;
    }

    h1, h2 {
      margin-top: 0;
    }

    .player {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .list {
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .item {
      background: #0e1522;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .form input,
    .form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    .form textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form button {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #4f7cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="wrap">

  <!-- TikTok секция -->
  <section class="left">
    <h1>🎥 TikTok LIVE</h1>

    <div class="player">
      <!-- 🔴 СМЕНИ VIDEO_ID -->
      <iframe
        src="https://www.tiktok.com/player/v1/VIDEO_ID"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <!-- Поздрави -->
  <section class="right">
    <h2>💬 Поздрави в реално време</h2>

    <div id="list" class="list"></div>

    <form id="form" class="form">
      <input id="name" placeholder="Име (по желание)">
      <textarea id="text" placeholder="Напиши поздрав..." required></textarea>
      <button type="submit">Изпрати</button>
      <div id="status" class="status">Свързване...</div>
    </form>
  </section>

</div>

<script>
  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const statusEl = document.getElementById("status");

  const wsProto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(wsProto + "://" + location.host);

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#039;"
    }[c]));
  }

  function render(item, top = true) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `
      <div class="meta">
        <strong>${escapeHtml(item.name)}</strong>
        <span>${new Date(item.ts).toLocaleTimeString("bg-BG")}</span>
      </div>
      <div>${escapeHtml(item.text)}</div>
    `;
    top ? list.prepend(el) : list.append(el);
  }

  ws.onopen = () => statusEl.textContent = "🟢 Свързан";
  ws.onclose = () => statusEl.textContent = "🔴 Връзката прекъсна";

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "history") {
      list.innerHTML = "";
      msg.items.forEach(i => render(i, false));
    }
    if (msg.type === "new") {
      render(msg.item, true);
    }
  };

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const text = document.getElementById("text").value;

    if (!text.trim()) return;

    await fetch("/api/greet", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, text })
    });

    document.getElementById("text").value = "";
  });
</script>

</body>
</html>
