<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Поздрави на живо</title>
  <link rel="stylesheet" href="style.css" />
  <!-- QR генератор (малък и стабилен) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>🎥 TikTok LIVE</h1>

      <div class="row">
        <div style="flex:1;min-width:260px">
          <input id="tiktokLink" placeholder="Постави TikTok линк (Share → Copy link)" />
          <div class="small">Сайтът сам вади VIDEO ID и го запомня на това устройство.</div>
        </div>
        <div style="display:flex;gap:10px;align-items:flex-start">
          <button id="applyLink" class="secondary" type="button">Смени LIVE</button>
          <span id="vidBadge" class="badge">VIDEO_ID: —</span>
        </div>
      </div>

      <hr />

      <div class="player">
        <iframe id="ttFrame" src="" allowfullscreen></iframe>
      </div>

      <hr />

      <div class="qrBox">
        <div class="qr" id="qr"></div>
        <div>
          <div class="qrNote">📱 Сканирай, за да отвориш формата на телефона.</div>
          <div class="small" id="qrLink"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>💬 Поздрави (след одобрение)</h2>
      <div id="list" class="list"></div>

      <hr />

      <form id="form">
        <input id="name" maxlength="40" placeholder="Име (по желание)" />
        <textarea id="text" maxlength="200" placeholder="Напиши поздрав..." required></textarea>
        <button type="submit">Изпрати за одобрение</button>
        <div id="status" class="status">Свързване…</div>
      </form>
    </section>
  </div>

  <script src="client.js"></script>
</body>
</html>
